<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Wi-Fi Inforcenter</title>
  <!--
    Página de redirecionamento para o portal externo Inforcenter.
    Suba este arquivo na pasta do hotspot do MikroTik (Files > flash/hotspot/login.html)
    substituindo o login.html padrão. O MikroTik substitui as variáveis $(...) ao servir.
    TROQUE "PORTAL_URL" pela URL real do portal (ex: https://hotspot.inforcenterfibra.com.br)
  -->
  <meta http-equiv="refresh" content="0; url=PORTAL_URL/?mac=$(mac)&ip=$(ip)&link-login-only=$(link-login-only)&link-orig=$(link-orig-esc)&error=$(error)">
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:60px;background:#0D0D0D;color:#fff">
  <p>Redirecionando para o portal Wi-Fi da Inforcenter...</p>
  <p><a style="color:#00C863" href="PORTAL_URL/?mac=$(mac)&ip=$(ip)&link-login-only=$(link-login-only)&link-orig=$(link-orig-esc)&error=$(error)">
    Clique aqui se não for redirecionado
  </a></p>
</body>
</html>
